name: GitHub Action Slack Notify CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js v24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - name: Enable Corepack
        run: corepack enable
      - name: yarn install and test
        run: |
          yarn
          yarn test
        env:
          CI: true
      - name: yarn build
        run: yarn build
